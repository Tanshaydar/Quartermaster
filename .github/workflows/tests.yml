name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest   # cache scanning & profile locking are Windows-first
    strategy:
      fail-fast: false
      matrix:
        # 3.14 evaluates annotations lazily (PEP 649) and can mask missing
        # typing imports — keep older versions in the matrix to catch that.
        python-version: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run test suite
        run: python run_tests.py -v
