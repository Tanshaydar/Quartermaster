name: Build & Release Standalone Binary

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Run Unit Tests
        run: python run_tests.py -v

      - name: Build Standalone Executable
        run: python build_standalone.py

      - name: Create Release Archive
        shell: pwsh
        run: |
          Compress-Archive -Path dist/Quartermaster/* -DestinationPath dist/Quartermaster-windows-x64.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/Quartermaster-windows-x64.zip
          draft: false
          prerelease: false
          generate_release_notes: true
