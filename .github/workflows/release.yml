name: Build & Release Standalone Binary

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Run Unit Tests
        run: python run_tests.py -v

      - name: Build Standalone Executable
        run: python build_standalone.py

      - name: Create Release Archive
        shell: pwsh
        run: |
          if (-not (Test-Path dist/Quartermaster-windows-x64.zip)) {
            Compress-Archive -Path dist/Quartermaster/* -DestinationPath dist/Quartermaster-windows-x64.zip -Force
          }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/Quartermaster-windows-x64.zip
            editor_bridge/Quartermaster-Bridge.unitypackage
          draft: false
          prerelease: false
          generate_release_notes: false

  build-linux:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxkbcommon0 libdbus-1-3

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Run Unit Tests
        run: python run_tests.py -v

      - name: Build Standalone Executable
        run: python build_standalone.py

      - name: Create Linux Release Archive
        run: |
          if [ ! -f dist/Quartermaster-linux-x64.tar.gz ]; then
            tar -czvf dist/Quartermaster-linux-x64.tar.gz -C dist Quartermaster
          fi

      - name: Upload Linux Release Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/Quartermaster-linux-x64.tar.gz
          draft: false
          prerelease: false
          generate_release_notes: false
